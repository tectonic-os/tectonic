name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "tect") | .version')"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] \
            || { echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2; exit 1; }

      - name: Build
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          cargo build --profile dist --locked --target x86_64-unknown-linux-musl

      - name: Package with checksum
        id: pkg
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/dist/tect
          # It mounts into build layers, so it has to carry no interpreter
          file "$bin" | grep -q static
          version="${GITHUB_REF_NAME#v}"
          asset="tect-v${version}-x86_64-linux-musl.tar.gz"
          # The binary plus the scaffolding `tect init` writes
          tar -czf "$asset" --transform "s|^${bin%/tect}/||" "$bin" assets
          sha256sum "$asset" | cut -d' ' -f1 > "${asset}.sha256"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Attest the tarball
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.asset }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${{ steps.pkg.outputs.asset }}" \
            "${{ steps.pkg.outputs.asset }}.sha256"
