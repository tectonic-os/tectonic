name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install shfmt
        env:
          SHFMT_VERSION: "3.13.1"
        run: |
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

      - name: Lint
        run: ./lint.sh

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Test on rust-version
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].rust_version')"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+${msrv}" test --locked
