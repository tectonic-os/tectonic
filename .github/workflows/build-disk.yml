---
name: Build disk images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/iso.template.toml'
      - 'scripts/render-iso-config.sh'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          FLAVOUR="$(./scripts/flavours.sh installer)"
          IMAGE_NAME="$(./scripts/flavours.sh image "$FLAVOUR")"
          IMAGE_REF="$(./scripts/registry.sh ref "$IMAGE_NAME"):${DEFAULT_TAG}"
          {
            echo "IMAGE_REF=${IMAGE_REF}"
            echo "DISK_TYPE=${DISK_TYPE}"
            echo "USER_UID=${USER_UID}"
            echo "USER_GID=${USER_GID}"
          } >> "${GITHUB_ENV}"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Render the installer config
        if: matrix.disk-type == 'anaconda-iso'
        run: echo "ISO_CONFIG=$(./scripts/render-iso-config.sh)" >> "${GITHUB_ENV}"

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@30960621b85c9e76c653082f9ef4cab5a10210d5 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && env.ISO_CONFIG || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REF }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          rootfs: btrfs
          additional-args: --use-librepo=True

      - name: Upload disk images and Checksum to Job Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
