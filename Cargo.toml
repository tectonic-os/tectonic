[package]
name = "tect"
version = "0.6.51"
edition = "2021"
# CI tests this minimum before accepting a dependency that needs a newer
# toolchain.
rust-version = "1.95"
publish = false
description = "Reads the image files and the per-module module.kdl manifests"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
kdl = "6.3.4"
libc = "0.2"
miette = { version = "7.6.0", features = ["fancy"] }
quick-xml = "0.42.0"
# The commit pin keeps the shared contract exact.
# Cargo.lock records the revision that was built.
# A local paths override can redirect development to a working tree.
# The override leaves Cargo.lock unchanged.
common = { git = "https://github.com/tectonic-os/common", rev = "8ad7beb36fe5228b1ed17555faa113a78ca865c8" }

[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
# `tect upgrade` unwinds so `upgrade::Staged` can remove a partially downloaded
# release after a panic. Aborting would leave that release beside the running
# binary.
strip = true

# The dist profile favours binary size while release favours rebuild speed.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# clap-markdown renders `docs/cli.md` in a test and never reaches a dist binary.
[dev-dependencies]
clap-markdown = "0.1.5"
common = { git = "https://github.com/tectonic-os/common", rev = "8ad7beb36fe5228b1ed17555faa113a78ca865c8", features = ["test-support"] }
insta = { version = "1.49.0", default-features = false, features = ["filters"] }
