[package]
name = "tect"
version = "0.6.52"
edition = "2021"
# CI tests this minimum before accepting a dependency that needs a newer
# toolchain.
rust-version = "1.95"
publish = false
description = "Reads the image files and the per-module module.kdl manifests"

[features]
fuzzing = ["dep:tempfile"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
kdl = "6.3.4"
libc = "0.2"
miette = { version = "7.6.0", features = ["fancy"] }
quick-xml = "0.42.0"
tempfile = { version = "3.27.0", optional = true }
# The commit pin keeps the shared contract exact.
# Cargo.lock records the revision that was built.
# A local paths override can redirect development to a working tree.
# The override leaves Cargo.lock unchanged.
common = { git = "https://github.com/tectonic-os/common", rev = "80c5601c2da11a3bc8c150ed41926e0985b31295" }

# lint.sh runs clippy with -D warnings, so a lint set to warn here also
# fails lint.sh.
[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "warn"
dbg_macro = "deny"
excessive_nesting = "warn"
todo = "deny"
too_many_lines = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[lints.rust]
unreachable_pub = "warn"

[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
# `tect upgrade` unwinds so `upgrade::Staged` can remove a partially downloaded
# release after a panic. Aborting would leave that release beside the running
# binary.
strip = true

# The dist profile favours binary size while release favours rebuild speed.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# clap-markdown renders `docs/cli.md` in a test and never reaches a dist binary.
[dev-dependencies]
clap-markdown = "0.1.5"
common = { git = "https://github.com/tectonic-os/common", rev = "80c5601c2da11a3bc8c150ed41926e0985b31295", features = ["test-support"] }
insta = { version = "1.49.0", default-features = false, features = ["filters"] }
