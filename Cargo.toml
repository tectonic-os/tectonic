[package]
name = "tect"
version = "0.6.48"
edition = "2021"
publish = false
description = "Reads the image files and the per-module module.kdl manifests"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
kdl = "6.3.4"
libc = "0.2"
miette = { version = "7.6.0", features = ["fancy"] }
# Pinned by rev, never by version. A change in `common` is a commit there and
# a bump here, which keeps the rev that was built with visible in `Cargo.lock`.
# To work on both trees at once, put a `paths` override in `.cargo/config.toml`,
# which redirects a git dependency and leaves `Cargo.lock` alone.
common = { git = "https://github.com/tectonic-os/common", rev = "4768623137f4901eb94c2284357d9123af0726bb" }

[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
# No `panic = "abort"` here. **The reason this was written for left with the
# installer** in `NEXT-53` stage 2 step 4: the LUKS, mount and staged-recipe
# guards are `work/installer/`'s now. What is left in this crate is one guard,
# `upgrade::Staged`, which removes a part-downloaded release so a panicking
# `tect upgrade` does not leave one beside the running binary. That is a
# smaller reason than the one that put this here, and unwinding costs about
# 385 KB of the stripped `dist` binary, so whether `tect` still wants it is an
# open question filed in `BACKLOG.md` rather than answered here.
strip = true

# What a release is built with; `release` stays tuned for rebuild speed
[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# Renders `docs/commands.md` in a test, so it never reaches a dist binary.
[dev-dependencies]
clap-markdown = "0.1.5"
