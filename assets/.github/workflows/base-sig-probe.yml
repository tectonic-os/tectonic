---
name: Base image signature probe

on:
  schedule:
    - cron: '30 6 * * *'  # tect:schedule
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Probe each base and correct the declaration
        id: probe
        run: |
          set -euo pipefail
          ./scripts/tect.sh fetch modules
          changed=""
          while IFS='|' read -r image base recorded file; do
            [ -n "${image}" ] || continue
            # `signed` records that a signature is published, which is not the
            # same as one a consumer can attribute. A keyless signature carries
            # a Fulcio certificate naming the signer and its issuer; a key-based
            # one carries none, and verifying it needs a public key obtained
            # some other way. Both are `#true`, so the run log says which.
            if cosign download signature "${base}" > /dev/null 2>&1; then
              actual="true"
              if cosign verify --certificate-identity-regexp='.*' \
                --certificate-oidc-issuer-regexp='.*' "${base}" > /dev/null 2>&1; then
                kind="signed, and the signature names its signer"
              else
                kind="signed, but the signature names no signer, so it can be verified only with a key obtained elsewhere"
              fi
            else
              actual="false"
              kind="unsigned"
            fi
            echo "${image}: ${base} is ${kind}, recorded as ${recorded}"
            [ "${actual}" != "${recorded}" ] || continue

            sed -i "s/signed #${recorded}/signed #${actual}/" "${file}"
            echo "  corrected ${file}: signed #${recorded} -> #${actual}"
            changed="${changed}${changed:+, }\`${image}\` (\`${base}\`): \`#${recorded}\` to \`#${actual}\`"
          done < <(./scripts/tect.sh plan --json \
            | jq -r '.images[] | "\(.id)|\(.base.image)|\(.base.signed)|\(.file)"')

          if [ -z "${changed}" ]; then
            echo "every base matches its declaration"
            exit 0
          fi
          {
            echo "changed=true"
            echo "summary=${changed}"
          } >> "${GITHUB_OUTPUT}"

      - name: Open or update the correction PR
        if: steps.probe.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
        run: |
          set -euo pipefail
          branch="base-signature-status"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          # `signed` reaches `generated/plan.json`, so a PR carrying only the
          # manifest edit lands a tree whose lint fails on a stale generated
          # file. This is the help that failure prints.
          ./scripts/tect.sh generate
          git add ./*.kdl generated
          git commit -m "Record the base image signature status" \
            -m "${SUMMARY}"
          # A fresh checkout has no remote-tracking ref to lease against, and
          # the branch is rebuilt from the base ref every run regardless.
          git push --force origin "${branch}"

          if gh pr view "${branch}" --json number > /dev/null 2>&1; then
            echo "updated the open PR for ${branch}"
            exit 0
          fi

          body="$(mktemp)"
          printf '%s\n\n' "${SUMMARY}" > "${body}"
          cat >> "${body}" <<'EOF'
          The `signed` field on a base records whether that image publishes a
          cosign signature. It is maintained by
          [this workflow](.github/workflows/base-sig-probe.yml) rather than by
          hand, so this PR only makes the declaration match the registry.

          **Nothing about the build changes.** `signed` reaches no build arg and
          no layer, and the images this repository publishes are cosign signed
          either way. It does reach `generated/plan.json`, which is why this PR
          carries the regenerated file beside the manifest.

          ## If a base turned `#true`

          The FROM pull can now be gated, which is the point of tracking this:

          1. Add a `policy.json` and a `registries.d` entry on the builder so
             the pull is verified rather than trusted.
          2. Bake the base's public key into the image so `bootc` can verify
             the base layer at upgrade time.

          ## If a base turned `#false`

          A base that was publishing signatures has stopped. Worth finding out
          why before merging.
          EOF

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${branch}" \
            --title "Base image signature status changed" \
            --body-file "${body}"
