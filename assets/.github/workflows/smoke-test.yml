---
name: VM boot smoke test
on:
  # tect:only push-publish
  schedule:
    - cron: '30 3 * * 1'  # tect:schedule
  # tect:end
  # tect:only scheduled-publish
  # Hung off the run that published, so a boot regression names the publication
  # that caused it rather than whatever the last seven days left behind.
  workflow_run:
    workflows: ['Build container image']
    types: [completed]
  # tect:end
  workflow_dispatch:

permissions: {}

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    # tect:only scheduled-publish
    # The two events the build publishes on, and only a build that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_dispatch'))
    # tect:end
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check /dev/kvm
        run: |
          test -e /dev/kvm
          # qemu runs as the runner user, which is in no group that owns it
          sudo chmod 666 /dev/kvm

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Install qemu and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: Resolve image name
        run: |
          ./scripts/tect.sh fetch modules
          echo "IMAGE_NAME=$(./scripts/tect.sh plan --json | jq -r .ungated_published)" \
            >> "${GITHUB_ENV}"

      # sudo podman carries root's credentials, and a package may be private.
      - name: Login to GitHub Container Registry (root)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull published image
        run: |
          sudo podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"

      - name: Generate SSH key for VM access
        run: |
          ssh-keygen -t ed25519 -f "${RUNNER_TEMP}/smoke-key" -N '' -C 'smoke-test'
          chmod 600 "${RUNNER_TEMP}/smoke-key"

      - name: Install the image to a disk
        run: |
          truncate -s 20G "${RUNNER_TEMP}/disk.raw"
          # the assertions arrive over ssh, and an image may ship sshd disabled
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /dev:/dev \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "${RUNNER_TEMP}":/output \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:latest" \
            bootc install to-disk \
            --via-loopback \
            --generic-image \
            --filesystem btrfs \
            --karg console=ttyS0,115200n8 \
            --karg systemd.wants=sshd.service \
            --root-ssh-authorized-keys /output/smoke-key.pub \
            /output/disk.raw
          ls -lh "${RUNNER_TEMP}/disk.raw"

      - name: Boot VM under qemu
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.fd "${RUNNER_TEMP}/vars.fd"

          qemu-system-x86_64 \
            -machine q35 \
            -m 4096 \
            -smp 2 \
            -cpu host \
            -enable-kvm \
            -display none \
            -drive if=pflash,unit=0,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,unit=1,format=raw,file="${RUNNER_TEMP}/vars.fd" \
            -serial "file:${RUNNER_TEMP}/console.log" \
            -drive file="${RUNNER_TEMP}/disk.raw",if=virtio,format=raw \
            -nic user,hostfwd=tcp::2222-:22 \
            > "${RUNNER_TEMP}/qemu.log" 2>&1 &
          QEMU_PID=$!
          echo "qemu_pid=${QEMU_PID}" >> "$GITHUB_ENV"

      - name: Wait for SSH
        timeout-minutes: 10
        run: |
          for i in $(seq 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                -i "${RUNNER_TEMP}/smoke-key" \
                -p 2222 root@localhost 'echo ok' 2>/dev/null; then
              echo "SSH ready after ${i} attempts"
              exit 0
            fi
            sleep 10
          done
          echo "SSH did not come up" >&2
          exit 1

      - name: Assertions
        timeout-minutes: 10
        run: |
          s() {
            ssh -o StrictHostKeyChecking=no \
              -i "${RUNNER_TEMP}/smoke-key" \
              -p 2222 root@localhost "$@"
          }

          echo "==> bootc status"
          s bootc status || { echo "FAIL: bootc status"; exit 1; }

          # Both readings are collected before either is judged: a degraded
          # state that exits first never names the unit that degraded it.
          echo "==> systemctl is-system-running"
          # --wait, because ssh answers before the last unit has started
          state="$(s systemctl is-system-running --wait)" || true

          echo "==> systemctl --failed"
          failed="$(s systemctl --failed --no-legend)" || true
          if [ -n "$failed" ]; then
            printf '%s\n' "$failed"
          else
            echo "No failed units"
          fi

          echo "system state: ${state:-unreachable}"
          if [ "$state" != running ]; then
            echo "FAIL: system state is '${state}', expected running" >&2
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "FAIL: the units above are failed" >&2
            exit 1
          fi

      - name: Serial console
        if: failure()
        run: |
          echo "==> qemu"
          cat "${RUNNER_TEMP}/qemu.log" 2>/dev/null || true
          echo "==> serial"
          if [ -s "${RUNNER_TEMP}/console.log" ]; then
            cat "${RUNNER_TEMP}/console.log"
          else
            echo "the VM wrote nothing to the serial console"
          fi

      - name: Stop qemu
        if: always()
        run: |
          kill "${qemu_pid}" 2>/dev/null || true
          wait "${qemu_pid}" 2>/dev/null || true
