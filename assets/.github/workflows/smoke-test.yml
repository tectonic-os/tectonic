---
name: VM boot smoke test
on:
  # tect:only push-publish
  schedule:
    - cron: '30 3 * * 1'  # tect:schedule
  # tect:end
  # tect:only scheduled-publish
  # Hung off the run that published, so a boot regression names the publication
  # that caused it.
  workflow_run:
    workflows: ['Build container image']
    types: [completed]
  # tect:end
  workflow_dispatch:

permissions: {}

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    # tect:only scheduled-publish
    # The two events the build publishes on, and only a build that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_dispatch'))
    # tect:end
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check /dev/kvm
        run: |
          test -e /dev/kvm
          # qemu runs as the runner user, which is in no group that owns it
          sudo chmod 666 /dev/kvm

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Install qemu and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: Resolve image name
        run: |
          ./scripts/tect.sh fetch modules
          echo "IMAGE_NAME=$(./scripts/tect.sh plan --json | jq -r .ungated_published)" \
            >> "${GITHUB_ENV}"

      # sudo podman carries root's credentials, and a package may be private.
      - name: Login to GitHub Container Registry (root)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull published image
        run: |
          sudo podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"

      - name: Install and boot the image
        timeout-minutes: 30
        run: |
          ./scripts/smoke.sh "${IMAGE_REGISTRY}/${IMAGE_NAME}:latest" "${RUNNER_TEMP}/vm"

      - name: Assertions
        timeout-minutes: 10
        run: |
          s() {
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR -i "${RUNNER_TEMP}/vm/key" \
              -p 2222 root@localhost "$@"
          }

          echo "==> bootc status"
          s bootc status || { echo "FAIL: bootc status"; exit 1; }

          # Both readings are collected before either is judged: a degraded
          # state that exits first never names the unit that degraded it.
          echo "==> systemctl is-system-running"
          # --wait, because ssh answers before the last unit has started
          state="$(s systemctl is-system-running --wait)" || true

          echo "==> systemctl --failed"
          failed="$(s systemctl --failed --no-legend)" || true
          if [ -n "$failed" ]; then
            printf '%s\n' "$failed"
          else
            echo "No failed units"
          fi

          # A skipped renderer is no failed unit, and it leaves a deb menu stale.
          echo "==> grub-menu-from-bls"
          rendered=yes
          if s systemctl cat grub-menu-from-bls.service > /dev/null 2>&1; then
            rendered="$(s systemctl show -P ConditionResult grub-menu-from-bls.service)"
            echo "condition: ${rendered}"
          fi

          echo "==> selinux denials"
          denials="$(s journalctl -b --no-pager | grep -Ei 'avc:[[:space:]]+denied')" || true
          if [ -n "$denials" ]; then
            printf '%s\n' "$denials"
          else
            echo "No SELinux denials"
          fi

          echo "system state: ${state:-unreachable}"
          if [ "$state" != running ]; then
            echo "FAIL: system state is '${state}', expected running" >&2
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "FAIL: the units above are failed" >&2
            exit 1
          fi
          if [ "$rendered" != yes ]; then
            echo "FAIL: grub-menu-from-bls did not run this boot" >&2
            exit 1
          fi
          # A denial is not a failed unit: the smoke test reports `running`
          # while the policy is refusing work, which is a pass that means
          # nothing. Judged last so the readings above are all printed first.
          if [ -n "$denials" ]; then
            echo "FAIL: the denials above were logged" >&2
            exit 1
          fi

      - name: Serial console
        if: failure()
        run: |
          echo "==> qemu"
          cat "${RUNNER_TEMP}/vm/qemu.log" 2>/dev/null || true
          echo "==> serial"
          if [ -s "${RUNNER_TEMP}/vm/console.log" ]; then
            cat "${RUNNER_TEMP}/vm/console.log"
          else
            echo "the VM wrote nothing to the serial console"
          fi

      - name: Stop qemu
        if: always()
        run: |
          kill "$(cat "${RUNNER_TEMP}/vm/qemu.pid" 2>/dev/null)" 2>/dev/null || true
